name: Release image

# Builds and pushes the container images to GHCR — the "no local build"
# install path the README advertises.
#
# Fires ONLY on a version tag push (v*), never per-commit — see
# docs/releasing.md. Multi-arch (amd64 + arm64 for Raspberry Pi) via
# buildx/QEMU; expect a long build. Actions are pinned by commit SHA
# (Dependabot's github-actions ecosystem keeps them current).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write        # signed provenance (Sigstore) for the pushed images
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the same gate CI runs on main, on the tagged commit itself (F-25, 3.83.0):
  # a tag on a red or unvetted commit never becomes an image
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      - name: Vendored UI assets match their checksum manifest
        run: cd ui/vendor && sha256sum -c SHA256SUMS --quiet
      - name: Lint (ruff)
        run: ruff check .
      - name: Run test suite
        run: python -m pytest -q --timeout=120 -p randomly
      - name: Known vulnerabilities in the pinned runtime set
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock
          require-hashes: true

  image:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` follows releases only — a pre-release tag (v3.81.0-rc1) keeps it where it is
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push gateway
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SBOM attestations travel with the image
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Signed build provenance (gateway)
        # a Sigstore-signed SLSA attestation in the repository's attestation
        # store — verifiable with `gh attestation verify oci://ghcr.io/… --owner sm26449`
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - id: meta-bridge
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-serial-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` follows releases only — a pre-release tag (v3.81.0-rc1) keeps it where it is
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push serial-bridge
        id: build-bridge
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./serial-bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-bridge.outputs.tags }}
          labels: ${{ steps.meta-bridge.outputs.labels }}
          # SLSA provenance + SBOM attestations travel with the image
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Signed build provenance (serial-bridge)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-serial-bridge
          subject-digest: ${{ steps.build-bridge.outputs.digest }}
          push-to-registry: true
