name: Release image

# Builds and pushes the container images to GHCR — the "no local build"
# install path the README advertises.
#
# COST CONTROL (private repo, PAID minutes): this workflow fires ONLY on a
# version tag push (v*), never per-commit. Multi-arch (amd64 + arm64 for
# Raspberry Pi) via buildx/QEMU — expect a long build; tag deliberately.
# While the repo is private the pushed images are private too; they become
# publicly pullable when the repo (or the package) is flipped public.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: meta-bridge
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-serial-bridge
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push serial-bridge
        uses: docker/build-push-action@v6
        with:
          context: ./serial-bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-bridge.outputs.tags }}
          labels: ${{ steps.meta-bridge.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
