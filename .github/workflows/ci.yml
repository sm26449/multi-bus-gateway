name: CI

on:
  push:
  pull_request:

# Cancel a superseded run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        # lock first (exact runtime pins — same set the image ships), then the
        # dev extras; requirements.txt ranges are satisfied by the pins.
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run test suite
        # --timeout: a hung loopback server fails in minutes, not the 6h job cap.
        # --cov-fail-under=72: floor just under the current 74% — raise it as
        # coverage grows, never lower it to make a PR pass.
        run: python -m pytest -q --timeout=120 --cov=multibus --cov-report=term --cov-fail-under=72
