name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not report security vulnerabilities here** —
        see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs actual behaviour.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (see the UI footer / `/health`).
      placeholder: "3.x.y"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Device / source type
      description: Which southbound source is involved (if any)?
      options:
        - Not device-specific
        - Modbus TCP
        - Modbus RTU (direct or serial-bridge / rtu-tcp)
        - HTTP / JSON
        - MQTT
        - Virtual meter
        - UI / API
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Container logs around the problem. **Redact tokens/passwords/hostnames.**
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: Deployment (Docker / bare Python), OS, broker/InfluxDB versions if relevant.
