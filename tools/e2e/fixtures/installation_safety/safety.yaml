# installation_safety_e2e, rules_e2e, commands_e2e: one grouped installation —
# `inverters` (units 1, 2; an HTTP source and a SunSpec source, both refusing;
# power_limit/restore commands), `grid` (unit 240 under its own id) and `spare`
# (unit 7, no template: nothing to read, so idle).
endpoints:
  - id: sunfield
    name: Sunfield PV
    enabled: true
    groups:
      - id: inverters
        role: inverter
        template: fronius_sunspec_inverter
        units: [1, 2]
        sources:
          - id: solar_api
            protocol: http
            url: "http://127.0.0.1:9/solar_api/v1/GetInverterRealtimeData.cgi?Scope=Device&DeviceId=${unit_id}&DataCollection=CommonInverterData"
            template: fronius_solar_api_inverter
            timeout: 2
            stale_after_s: 30
          - id: sunspec
            protocol: tcp
            host: 127.0.0.1
            port: 15502
            timeout: 1
            template: fronius_sunspec_inverter
        commands: [{name: power_limit}, {name: restore}]
      - id: grid
        role: meter
        units: [{unit_id: 240, id: sunfield-meter-240, name: Grid meter}]
        sources: [{id: sunspec, protocol: tcp, host: 127.0.0.1, port: 15502, timeout: 1,
                   template: fronius_sunspec_meter}]
      - id: spare
        role: meter
        units: [7]
        connection: {protocol: tcp, host: 127.0.0.1, port: 15502, timeout: 1}
