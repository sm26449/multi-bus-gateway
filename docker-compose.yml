services:
  multi-bus-gateway:
    build: .
    container_name: multi-bus-gateway
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:${UI_PORT:-8080}"
      # Virtual meters — publish a contiguous range so they are reachable on the
      # LAN. Any virtual meter on a port in this range works without editing the
      # compose again; grow VMETER_PORT_END if you need more. (See docs/MANUAL.md §11.)
      - "${VMETER_PORT_START:-1502}-${VMETER_PORT_END:-1512}:${VMETER_PORT_START:-1502}-${VMETER_PORT_END:-1512}"
      # Standard Modbus port — some consumers (e.g. the Fronius DataManager) poll
      # their meter on :502. Remap the HOST side (MODBUS_502_HOST_PORT in .env)
      # if host port 502 is already in use, or remove the line entirely.
      - "${MODBUS_502_HOST_PORT:-502}:502"
    # The app runs as a non-root user (3.24.1+); :502 is a privileged port, so
    # lower the unprivileged-port floor INSIDE the container's own network
    # namespace. No capability grant, no host-wide sysctl. Only needed if a
    # virtual meter binds a port below 1024 (like the :502 above).
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    volumes:
      - ./config:/app/config
      # (no docs mount — the image bakes docs/modbus_data.json, the only file
      # the app reads from there)
      # For live frontend editing without rebuilds, see
      # docker-compose.override.yml.example (mounts ./ui over the baked /app/ui).
    environment:
      # Virtual meters (the UI uses this range to offer/validate instance ports)
      - VMETER_PORT_START=${VMETER_PORT_START:-1502}
      - VMETER_PORT_END=${VMETER_PORT_END:-1512}
      # Modbus / MQTT / InfluxDB connection settings are configured from the UI
      # (Config -> Settings) and persisted to the mounted config/config.yaml, applied
      # live without a restart. The app prompts you on first run if it can't connect.
      # If you'd rather pre-seed them from the environment, uncomment the lines below
      # (and set them in .env) — note an env value OVERRIDES the UI/yaml on every start.
      # - MODBUS_HOST
      # - MODBUS_PORT
      # - MODBUS_UNIT_ID
      # - MODBUS_STALE_AFTER_S   # seconds before the primary source reads stale
      # - MQTT_ENABLED
      # - MQTT_BROKER
      # - MQTT_PORT
      # - MQTT_USERNAME
      # - MQTT_PASSWORD
      # - MQTT_PREFIX
      # - MQTT_PUBLISH_MODE
      # - INFLUXDB_ENABLED
      # - INFLUXDB_URL
      # - INFLUXDB_TOKEN
      # - INFLUXDB_ORG
      # - INFLUXDB_BUCKET
      # - INFLUXDB_PUBLISH_MODE
      # UI
      - UI_PORT
      # Security — optional API key required for state-changing requests (empty = open)
      - API_KEY
      # Device Builder (ESPHome). ESPHOME_URL seeds the feature on a fresh
      # deploy — the bundled esphome service below makes it work with zero
      # configuration. Turning the Builder off in the UI sticks; set
      # ESPHOME_ENABLED explicitly only to force it either way on every start.
      - ESPHOME_URL=${ESPHOME_URL:-http://esphome:6052}
      # - ESPHOME_ENABLED=true
      - ESPHOME_USERNAME=${ESPHOME_DASHBOARD_USERNAME:-}
      - ESPHOME_PASSWORD=${ESPHOME_DASHBOARD_PASSWORD:-}
      # serial bridge control API (rtu-bridge profile); override if renamed
      - SERIAL_BRIDGE_URL
    networks:
      - monitoring
    # no depends_on: `up -d multi-bus-gateway` starts EXACTLY the gateway
    # (the boot network-probe waits for the broker anyway), so the overlay
    # scenario never drags a second broker onto a host that has one

  # MQTT broker — a REQUIRED part of the complete solution, bundled so the
  # whole pipeline works from the first `docker compose up -d` (the gateway's
  # default broker host is `mosquitto`). Anonymous on the LAN by default —
  # see mosquitto/config/mosquitto.conf for the two-line credential setup.
  # Already have a broker? `docker compose up -d multi-bus-gateway` starts
  # the gateway alone and you point it at yours from Config -> MQTT.
  mosquitto:
    # Pinned minor: upstream :latest float has broken retain semantics before.
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mbg-mosquitto
    restart: unless-stopped
    ports:
      # host-port mapping only (MQTT_PORT stays the GATEWAY override for an
      # external broker port — two different knobs on purpose)
      - "${MQTT_BROKER_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    networks:
      - monitoring

  # MQTT Explorer — web UI over every topic the gateway publishes; the
  # fastest way to SEE the data flowing. http://<host>:4000
  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer:latest
    container_name: mbg-mqtt-explorer
    restart: unless-stopped
    ports:
      - "${MQTT_EXPLORER_PORT:-4000}:4000"
    volumes:
      - mqtt-explorer-config:/mqtt-explorer/config
    depends_on:
      - mosquitto
    networks:
      - monitoring

  # ESPHome — the build engine behind the Device Builder section. Ships with
  # the stack so firmware authoring works OUT OF THE BOX: the gateway finds it
  # at http://esphome:6052 (see ESPHOME_URL above) and proxies everything —
  # nodes, builds, flashing, logs — through its own UI and audit trail.
  #
  #   * No published port on purpose: one interface, one login. If you also
  #     want the raw ESPHome dashboard on the LAN, uncomment `ports:` below
  #     (and consider ESPHOME_DASHBOARD_USERNAME/PASSWORD).
  #   * Don't need the Builder at all? `docker compose up -d multi-bus-gateway`
  #     starts the gateway alone, or set ESPHOME_ENABLED=false in .env — the
  #     section stays hidden-but-configurable either way.
  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome
    restart: unless-stopped
    # ports:
    #   - "6052:6052"
    volumes:
      - esphome-config:/config
    environment:
      - TZ=${TZ:-Europe/Bucharest}
      # Optional login on the ESPHome dashboard itself. The gateway picks the
      # same values up automatically (they feed ESPHOME_USERNAME/PASSWORD).
      - USERNAME=${ESPHOME_DASHBOARD_USERNAME:-}
      - PASSWORD=${ESPHOME_DASHBOARD_PASSWORD:-}
    command: dashboard /config
    networks:
      - monitoring

  # InfluxDB — the history/energy store; part of the complete stack.
  # First boot self-configures (see the INIT_ env defaults + .env.example).
  influxdb:
    image: influxdb:2.7
    container_name: mbg-influxdb
    restart: unless-stopped
    ports:
      # host port only — remap when the host already runs an InfluxDB
      - "${INFLUXDB_HOST_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      # First-boot self-setup: working defaults so history/energy work out of
      # the box. CHANGE the password/token before any real exposure (.env) —
      # then paste the same token in the gateway (Config -> InfluxDB).
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD:-multibus-change-me}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:-multibus}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-multibus}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:-multibus-dev-token-change-me}
    networks:
      - monitoring

  # Grafana — dashboards over the same InfluxDB; part of the complete stack.
  grafana:
    image: grafana/grafana:latest
    container_name: mbg-grafana
    restart: unless-stopped
    ports:
      # host port only — remap when the host already runs a Grafana
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-multibus-change-me}
    networks:
      - monitoring

  # RTU-over-network serial bridge (opt-in profile — needs /dev access):
  # exposes each USB serial adapter as a stable TCP endpoint (ser2net) with
  # hotplug reload + a scan API the gateway's Add-Device wizard uses. Start
  # it with:  docker compose --profile rtu-bridge up -d
  # See docs/rtu-serial.md. The container name matches the gateway's default
  # SERIAL_BRIDGE_URL (http://pv-stack-serial-bridge:7000) — override that
  # env on the gateway if you rename it.
  serial-bridge:
    build:
      context: ./serial-bridge
    image: mbg-serial-bridge:latest
    container_name: pv-stack-serial-bridge
    restart: unless-stopped
    environment:
      # adapters to NEVER expose (claimed by another service). Comma-separated;
      # each token matches a stable id, /dev path, or USB port-path.
      - BRIDGE_EXCLUDE=${BRIDGE_EXCLUDE:-}
    # Unprivileged access to hotplugged USB serial lines: /dev is bound
    # READ-ONLY (blocks node creation/renames from inside; opening a tty for
    # I/O is unaffected) and only ttyUSB (major 188) / ttyACM (major 166)
    # nodes are allowed. The process runs non-root (uid 10002, dialout).
    volumes:
      - /dev:/dev:ro
      - serial-bridge-data:/data
    device_cgroup_rules:
      - 'c 188:* rmw'
      - 'c 166:* rmw'
    ports:
      # control API for host-side debug only; the gateway reaches both the
      # API and the data ports over the internal network by name
      - "127.0.0.1:7000:7000"
    networks:
      - monitoring
    profiles:
      - rtu-bridge

# The base file is STANDALONE and COMPLETE: `docker compose up -d` needs
# nothing but this repo and brings up the full solution (gateway + MQTT
# broker + MQTT Explorer + InfluxDB + Grafana + ESPHome). The network it
# creates carries the ecosystem name (pv-stack-network), so anything you add
# later can join it by name. Already RUNNING a stack on that network? Use
# the overlay and start only the gateway services:
#   docker compose -f docker-compose.yml -f docker-compose.pv-stack.yml \
#     up -d multi-bus-gateway
networks:
  monitoring:
    name: ${PV_STACK_NETWORK:-pv-stack-network}
    driver: bridge

volumes:
  mosquitto-data:
  mqtt-explorer-config:
  influxdb-data:
  influxdb-config:
  grafana-data:
  esphome-config:
  serial-bridge-data:
