services:
  multi-bus-gateway:
    build: .
    container_name: multi-bus-gateway
    restart: unless-stopped
    ports:
      - "${UI_PORT}:${UI_PORT}"
      # Virtual meters — publish a contiguous range so they are reachable on the
      # LAN. Any virtual meter on a port in this range works without editing the
      # compose again; grow VMETER_PORT_END if you need more. (See docs/MANUAL.md §11.)
      - "${VMETER_PORT_START:-1502}-${VMETER_PORT_END:-1512}:${VMETER_PORT_START:-1502}-${VMETER_PORT_END:-1512}"
      # Standard Modbus port — some consumers (e.g. the Fronius DataManager) poll
      # their meter on :502. Remove this line if host port 502 is already in use.
      - "502:502"
    volumes:
      - ./config:/app/config
      - ./docs:/app/docs:ro
      # For live frontend editing without rebuilds, see
      # docker-compose.override.yml.example (mounts ./ui over the baked /app/ui).
    environment:
      # Virtual meters (the UI uses this range to offer/validate instance ports)
      - VMETER_PORT_START=${VMETER_PORT_START:-1502}
      - VMETER_PORT_END=${VMETER_PORT_END:-1512}
      # Modbus / MQTT / InfluxDB connection settings are configured from the UI
      # (Config -> Settings) and persisted to the mounted config/config.yaml, applied
      # live without a restart. The app prompts you on first run if it can't connect.
      # If you'd rather pre-seed them from the environment, uncomment the lines below
      # (and set them in .env) — note an env value OVERRIDES the UI/yaml on every start.
      # - MODBUS_HOST
      # - MODBUS_PORT
      # - MODBUS_UNIT_ID
      # - MQTT_ENABLED
      # - MQTT_BROKER
      # - MQTT_PORT
      # - MQTT_USERNAME
      # - MQTT_PASSWORD
      # - MQTT_PREFIX
      # - MQTT_PUBLISH_MODE
      # - INFLUXDB_ENABLED
      # - INFLUXDB_URL
      # - INFLUXDB_TOKEN
      # - INFLUXDB_ORG
      # - INFLUXDB_BUCKET
      # - INFLUXDB_PUBLISH_MODE
      # UI
      - UI_PORT
      # Security — optional API key required for state-changing requests (empty = open)
      - API_KEY
      # Device Builder (ESPHome). ESPHOME_URL seeds the feature on a fresh
      # deploy — the bundled esphome service below makes it work with zero
      # configuration. Turning the Builder off in the UI sticks; set
      # ESPHOME_ENABLED explicitly only to force it either way on every start.
      - ESPHOME_URL=${ESPHOME_URL:-http://esphome:6052}
      # - ESPHOME_ENABLED=true
      - ESPHOME_USERNAME=${ESPHOME_DASHBOARD_USERNAME:-}
      - ESPHOME_PASSWORD=${ESPHOME_DASHBOARD_PASSWORD:-}
    networks:
      - monitoring
      - pv-stack-network

  # ESPHome — the build engine behind the Device Builder section. Ships with
  # the stack so firmware authoring works OUT OF THE BOX: the gateway finds it
  # at http://esphome:6052 (see ESPHOME_URL above) and proxies everything —
  # nodes, builds, flashing, logs — through its own UI and audit trail.
  #
  #   * No published port on purpose: one interface, one login. If you also
  #     want the raw ESPHome dashboard on the LAN, uncomment `ports:` below
  #     (and consider ESPHOME_DASHBOARD_USERNAME/PASSWORD).
  #   * Don't need the Builder at all? `docker compose up -d multi-bus-gateway`
  #     starts the gateway alone, or set ESPHOME_ENABLED=false in .env — the
  #     section stays hidden-but-configurable either way.
  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome
    restart: unless-stopped
    # ports:
    #   - "6052:6052"
    volumes:
      - esphome-config:/config
    environment:
      - TZ=${TZ:-Europe/Bucharest}
      # Optional login on the ESPHome dashboard itself. The gateway picks the
      # same values up automatically (they feed ESPHOME_USERNAME/PASSWORD).
      - USERNAME=${ESPHOME_DASHBOARD_USERNAME:-}
      - PASSWORD=${ESPHOME_DASHBOARD_PASSWORD:-}
    command: dashboard /config
    networks:
      - monitoring

  # Optional: InfluxDB for local storage
  influxdb:
    image: influxdb:2.7
    container_name: janitza-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME
      - DOCKER_INFLUXDB_INIT_PASSWORD
      - DOCKER_INFLUXDB_INIT_ORG
      - DOCKER_INFLUXDB_INIT_BUCKET
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
    networks:
      - monitoring
    profiles:
      - influxdb

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: janitza-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD
    networks:
      - monitoring
    profiles:
      - grafana

networks:
  monitoring:
    driver: bridge
  pv-stack-network:
    external: true

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  esphome-config:
