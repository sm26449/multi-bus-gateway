# Mosquitto for the Multi-Bus Gateway bundled stack.
#
# OUT-OF-THE-BOX TEST DEFAULT: anonymous access on the LAN, so the full
# pipeline works from the first `docker compose up -d`. Before exposing the
# broker beyond a trusted network, add credentials:
#   1) docker exec -it mbg-mosquitto mosquitto_passwd -c /mosquitto/config/passwd <user>
#   2) uncomment the two lines below, restart the container,
#   3) set the same user/password in the gateway (Config -> MQTT).
# allow_anonymous false
# password_file /mosquitto/config/passwd

# 3.81.0: the bundled broker requires credentials. The password file is
# (re)generated at every container start from MQTT_USERNAME / MQTT_PASSWORD
# in .env (see the mosquitto service's command in docker-compose.yml); every
# consumer on the LAN — the gateway, Home Assistant, Node-RED, Telegraf —
# connects with the same credentials. Add more users with mosquitto_passwd
# on /mosquitto/data/passwd (they survive restarts; the first user is
# re-written each start).
allow_anonymous false
password_file /mosquitto/data/passwd

# Standard MQTT
listener 1883

# WebSockets (browser clients / HA companion tools)
listener 9001
protocol websockets

# Retained messages + subscriptions survive a broker restart
persistence true
persistence_location /mosquitto/data/

log_dest stdout
