# Central pytest configuration (external audit: there was none — no testpaths,
# skips invisible as silent dots, deprecations free to rot).
[pytest]
testpaths = tests
# the tests import each other as `tests.test_x` (shared harnesses); a bare
# `pytest` does not put the repo root on sys.path the way `python -m pytest`
# does, so it failed at collection (F-45, 3.83.0)
pythonpath = .
# -rs: every skip prints its reason in the summary — a permanently-skipped
# test must be visible, not a dot (the FC4-write guard hid that way for
# months).
addopts = -rs
filterwarnings =
    # keep the signal: fail on OUR OWN deprecation uses, ignore the noisy
    # third-party ones we cannot fix from here
    default
    error::DeprecationWarning:multibus.*
